name: Add TFS issue prefix

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add-prefix:
    runs-on: ubuntu-latest

    steps:
      - name: Add TFS number to issue title
        uses: actions/github-script@v8
        with:
          script: |
            const currentIssue = context.payload.issue;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              }
            );

            const onlyIssues = issues
              .filter((item) => !item.pull_request)
              .sort((a, b) => a.number - b.number);

            const issueIndex = onlyIssues.findIndex(
              (item) => item.number === currentIssue.number
            );

            const tfsNumber = issueIndex + 1;
            const prefix = `[TFS-${tfsNumber}]`;

            const cleanTitle = currentIssue.title.replace(
              /^\[TFS-\d+\]\s*/,
              ''
            );

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: currentIssue.number,
              title: `${prefix} ${cleanTitle}`,
            });
